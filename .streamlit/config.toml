[theme]
base = "light"
primaryColor = "#C96442"
backgroundColor = "#F4F3EE"
secondaryBackgroundColor = "#FAF9F5"
textColor = "#141413"
font = "sans serif"

[client]
toolbarMode = "viewer"
showSidebarNavigation = false

[server]
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      CSV_PATH: data/support_tickets.csv
      DB_PATH: data/tickets.db

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

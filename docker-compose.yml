services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      CSV_PATH: data/support_tickets.csv
      DB_PATH: data/tickets.db
      QUERY_RESULT_ROW_CAP: ${QUERY_RESULT_ROW_CAP:-50}
      SQL_TIMEOUT_SECONDS: ${SQL_TIMEOUT_SECONDS:-3}
      SQL_MAX_JOINS: ${SQL_MAX_JOINS:-2}
      API_TOKEN: ${API_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
